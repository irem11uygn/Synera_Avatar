# Her push (main) ve PR'da: sunucu (biçim, lint, testler, yapay zekâ testleri), web (tip, lint, test, derleme),
# Android (birim testleri + debug APK), bağımlılık açığı taraması (pip-audit, npm audit) ve git geçmişinde
# gizli bilgi taraması (gitleaks). Eylemler sürüm etiketiyle değil commit SHA'sıyla sabitlenmiştir; iş akışı
# yalnız okuma izniyle çalışır.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sunucu:
    name: Sunucu ve yapay zekâ
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: İmaj ve veritabanı
        run: |
          docker compose build api
          docker compose up -d --wait db
      - name: Biçim ve lint (ruff)
        run: docker compose run --rm --no-deps api sh -c "ruff format --check app tests && ruff check app tests"
      - name: Sunucu testleri (pytest, MySQL)
        run: docker compose run --rm --no-deps api pytest -q
      - name: Yapay zekâ testleri
        run: docker compose run --rm --no-deps api sh -c "cd /ml && pytest -q"
      - name: Python bağımlılık açıkları (pip-audit)
        run: >
          docker run --rm -v "$PWD/backend:/src:ro" python:3.12-slim
          sh -c "pip install -q --root-user-action=ignore pip-audit==2.10.1 && pip-audit -r /src/requirements.txt"
      - name: Kapat
        if: always()
        run: docker compose down -v

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Birim testleri (vitest)
        run: npm test
      - name: Tip denetimi ve derleme
        run: npm run build
      - name: Bağımlılık açıkları (npm audit)
        run: npm audit --audit-level=moderate

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Birim testleri ve debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug

  gizli-bilgi:
    name: Gizli bilgi taraması
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (bütün git geçmişi)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
