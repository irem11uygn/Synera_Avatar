server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Güvenlik başlıkları: sayfa başka sitede çerçeve içine alınamaz, tür tahmini yapılmaz,
    # yalnız kendi adresimizden betik/stil yüklenir (antd satır içi stil kullanır).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # API istekleri aynı adresten api servisine aktarılır (CORS gerekmez).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;  # giriş denemesi sınırı gerçek istemci adresine göre
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Derlenmiş dosyaların adı içeriklerine göre değişir: uzun süre önbellekte kalabilir.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer; index.html hiç önbelleğe alınmaz.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
